name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  distribution:
    permissions:
      contents: write
    uses: brainage04/FabricModdingConventions/.github/workflows/reusable-multiloader-release.yml@v2.4.13
    with:
      additional_artifact_pattern: modernminecraftmodtemplate-neoforge-*.jar
      modrinth_project_id: ${{ vars.MODRINTH_PROJECT_ID }}
      curseforge_project_id: ${{ vars.CURSEFORGE_PROJECT_ID }}
      curseforge_project_slug: modernminecraftmodtemplate
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
      modrinth_token: ${{ secrets.MODRINTH_TOKEN }}
      curseforge_token: ${{ secrets.CURSEFORGE_TOKEN }}
